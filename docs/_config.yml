# GitHub Pages configuration for SNAP documentation

title: SNAP Documentation
description: Comprehensive documentation for SNAP container checkpointing platform
author: WeaverSoft
email: support@weaversoft.io

# GitHub Pages settings
baseurl: "/Snap"
url: "https://weaversoftio.github.io"

# Build settings
markdown: kramdown
highlighter: rouge
theme: just-the-docs

# Plugins
plugins:
  - jekyll-feed
  - jekyll-sitemap
  - jekyll-seo-tag
  - jekyll-include-cache

# Navigation (Sidebar)
nav_external_links:
  - title: GitHub Repository
    url: https://github.com/weaversoftio/Snap

# Sidebar navigation structure
just_the_docs:
  nav_fold: 1
  nav_external_links:
    - title: GitHub Repository
      url: https://github.com/weaversoftio/Snap
  search: true
  search_tokenizer_separator: /[\s/]+/
  heading_anchors: true
  color_scheme: light
  aux_links:
    GitHub Repository:
      - "//github.com/weaversoftio/Snap"
  logo: "/assets/logo.png"

# Collections
collections:
  guides:
    output: true
    permalink: /:collection/:name/

# Defaults
defaults:
  - scope:
      path: ""
      type: "pages"
    values:
      layout: "default"
  - scope:
      path: ""
      type: "guides"
    values:
      layout: "guide"

# Exclude from processing
exclude:
  - Gemfile
  - Gemfile.lock
  - node_modules
  - vendor/bundle/
  - vendor/cache/
  - vendor/gems/
  - vendor/ruby/

# Include in site
include:
  - _pages

# SEO
seo:
  type: "WebSite"
  name: "SNAP Documentation"
  description: "Comprehensive documentation for SNAP container checkpointing platform"
  url: "https://weaversoftio.github.io/Snap"
  image: "https://weaversoftio.github.io/Snap/assets/logo.png"

# Social links
social:
  github: weaversoftio
  twitter: weaversoftio
  email: support@weaversoft.io

# Footer
footer:
  message: "SNAP - Container State Management Platform"
  copyright: "© 2024 WeaverSoft. All rights reserved."
