# Default values for demo-app
replicaCount: 1

image:
  repository: busybox
  pullPolicy: IfNotPresent
  tag: "stable"

imagePullSecrets:
  - name: nexus-registry-secret

nameOverride: ""
fullnameOverride: ""

serviceAccount:
  # Specifies whether a service account should be created
  create: true
  # Annotations to add to the service account
  annotations: {}
  # The name of the service account to use.
  name: ""

podAnnotations: {}

podSecurityContext: {}

# Snap configuration - enables snap checkpointing for this application
snap:
  enabled: true
  # fsGroup: 2000

securityContext: {}
  # capabilities:
  #   drop:
  #   - ALL
  # readOnlyRootFilesystem: true
  # runAsNonRoot: true
  # runAsUser: 1000

service:
  type: ClusterIP
  port: 80
  targetPort: 8080

resources:
  limits:
    cpu: 200m
    memory: 256Mi
  requests:
    cpu: 100m
    memory: 128Mi

autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 100
  targetCPUUtilizationPercentage: 80

# Application configuration
app:
  # Command to run
  command: ["/bin/sh", "-c"]
  # Arguments for the command
  args:
    - |
      touch /tmp/app-ready
      while true; do
        date
        sleep 1
      done

# Health check probes
probes:
  enabled: true
  liveness:
    enabled: true
    initialDelaySeconds: 30
    periodSeconds: 10
    timeoutSeconds: 5
    failureThreshold: 3
  readiness:
    enabled: true
    initialDelaySeconds: 5
    periodSeconds: 5
    timeoutSeconds: 3
    failureThreshold: 3
  startup:
    enabled: false
    initialDelaySeconds: 0
    periodSeconds: 10
    timeoutSeconds: 1
    failureThreshold: 30

nodeSelector: {}

tolerations: []

affinity: {}

