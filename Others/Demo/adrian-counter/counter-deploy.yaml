apiVersion: apps/v1
kind: Deployment
metadata:
  annotations:
  labels:
    run: checkpoint-demo
  name: checkpoint-demo
spec:
  replicas: 1
  selector:
    matchLabels:
      run: checkpoint-demo
  template:
    metadata:
      labels:
        run: checkpoint-demo
    spec:
      runtimeClassName: runc
      containers:
      # - command:
      #   - /bin/sh
      #   - -c
      #   - sleep 365d
      - image: quay.io/adrianreber/counter:latest
        imagePullPolicy: IfNotPresent
        name: checkpoint-demo
      imagePullSecrets:
      - name: regcred
