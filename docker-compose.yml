services:
  snapapi:
    build:
      context: ./SnapApi
      dockerfile: Dockerfile
    container_name: snapapi
    image: weaversoft/snapapi:${BRANCH_NAME:-main}
    stop_grace_period: 2s
    ports:
      - "8000:8000"
      - "8443:8443"  # SnapHook webhook port
    environment:
      # SnapApi configuration
      - SNAP_ORIGINS=http://localhost:8080,*
      - SNAP_API_URL=http://192.168.33.209:8000
      # SSL configuration (set to 'true' to enable SSL verification)
      - KUBE_VERIFY_SSL=false
      # Cluster status check version requirements
      - CRIO_VERSION_REQUIRED=${CRIO_VERSION_REQUIRED:-1.31.2}
      - RUNC_VERSION_REQUIRED=${RUNC_VERSION_REQUIRED:-1.2.4}

    volumes:
      # Mount config folder for persistence
      - snapapi-config:/app/config
      # Mount checkpoint storage
      - snapapi-checkpoints:/app/checkpoints
    networks:
      - snap-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/docs"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    command: >
      sh -c "
        # Start the API with hot reload
        uvicorn app:app --host 0.0.0.0 --port 8000 --reload --reload-dir /app --proxy-headers
      "

  snapui:
    build:
      context: ./SnapUi
      dockerfile: Dockerfile

    container_name: snapui
    image: weaversoft/snapui:${BRANCH_NAME:-main}
    ports:
      - "0.0.0.0:8080:8080"
    environment:
      # API configuration - these can be overridden via environment variables or .env file
      # The API_URL should be the external URL that browsers can access (e.g., http://localhost:8000 or http://<host-ip>:8000)
      # The WS_URL should be the WebSocket URL (e.g., ws://localhost:8000 or ws://<host-ip>:8000)
      # Defaults to localhost for local development - override if accessing from remote hosts
      - API_URL=${API_URL:-http://192.168.33.209:8000}
      - WS_URL=${WS_URL:-ws://192.168.33.209:8000}
    networks:
      - snap-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8080/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

volumes:
  snapapi-config:
    driver: local
  snapapi-checkpoints:
    driver: local

networks:
  snap-network:
    driver: bridge