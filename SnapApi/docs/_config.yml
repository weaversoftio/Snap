# GitHub Pages configuration for SNAP documentation

title: SNAP Documentation
description: Comprehensive documentation for SNAP container checkpointing platform
author: WeaverSoft
email: support@weaversoft.io

# GitHub Pages settings
baseurl: "/Snap"
url: "https://weaversoftio.github.io"

# Build settings
markdown: kramdown
highlighter: rouge
theme: minima

# Plugins
plugins:
  - jekyll-feed
  - jekyll-sitemap
  - jekyll-seo-tag

# Navigation
navigation:
  - title: Getting Started
    children:
      - title: Quick Start Guide
        url: /quick-start
      - title: Installation Guide
        url: /installation
      - title: Configuration Guide
        url: /configuration
  - title: User Guides
    children:
      - title: Cluster Management
        url: /cluster-management
      - title: Checkpointing Guide
        url: /checkpointing
      - title: Registry Integration
        url: /registry-integration
      - title: Automation Guide
        url: /automation
  - title: API Reference
    children:
      - title: API Overview
        url: /api-overview
      - title: API Endpoints
        url: /api-endpoints
      - title: Authentication
        url: /authentication
  - title: Security & Operations
    children:
      - title: Security Guide
        url: /security
      - title: RBAC Setup Guide
        url: /rbac-setup
      - title: Troubleshooting Guide
        url: /troubleshooting
  - title: Additional Resources
    children:
      - title: FAQ
        url: /faq
      - title: Add Cluster Guide
        url: /add-cluster-guide
      - title: Migration Guide
        url: /migration-guide

# Collections
collections:
  guides:
    output: true
    permalink: /:collection/:name/

# Defaults
defaults:
  - scope:
      path: ""
      type: "pages"
    values:
      layout: "default"
  - scope:
      path: ""
      type: "guides"
    values:
      layout: "guide"

# Exclude from processing
exclude:
  - Gemfile
  - Gemfile.lock
  - node_modules
  - vendor/bundle/
  - vendor/cache/
  - vendor/gems/
  - vendor/ruby/

# Include in site
include:
  - _pages

# SEO
seo:
  type: "WebSite"
  name: "SNAP Documentation"
  description: "Comprehensive documentation for SNAP container checkpointing platform"
  url: "https://weaversoftio.github.io/Snap"
  image: "https://weaversoftio.github.io/Snap/assets/snap-logo.png"

# Social links
social:
  github: weaversoftio
  twitter: weaversoftio
  email: support@weaversoft.io

# Footer
footer:
  message: "SNAP - Container State Management Platform"
  copyright: "© 2024 WeaverSoft. All rights reserved."
