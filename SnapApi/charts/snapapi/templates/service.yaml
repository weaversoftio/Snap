apiVersion: v1
kind: Service
metadata:
  name: {{ include "snapapi.fullname" . }}
  labels:
    {{- include "snapapi.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.apiPort }}
      targetPort: api
      protocol: TCP
      name: api
    - port: {{ .Values.service.webhookPort }}
      targetPort: webhook
      protocol: TCP
      name: webhook
  selector:
    {{- include "snapapi.selectorLabels" . | nindent 4 }}
