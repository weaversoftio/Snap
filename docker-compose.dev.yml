services:
  snapapi:
    build:
      context: ./SnapApi
      dockerfile: Dockerfile
    image: localhost:5000/snapapi:v1.0.0
    container_name: snapapi-dev
    stop_grace_period: 2s
    privileged: true
    cap_add:
    - SYS_ADMIN
    group_add:
      - "0"  # root group
      - "998"  # crio group
      - "999"  # podman group
    security_opt:
      - label=disable
    ports:
      - "8000:8000"
      - "8443:8443"  # SnapHook webhook port
    environment:
      # SnapApi configuration
      - SNAP_ORIGINS=http://localhost:3000,http://localhost:8080,http://192.168.33.209:3000,*
      - SNAP_API_URL=http://192.168.33.209:8000
      # SnapWatcher operator configuration
      - WATCHER_CLUSTER_NAME=crc
      - WATCHER_MODE=compose
      # SSL configuration (set to 'true' to enable SSL verification)
      - KUBE_VERIFY_SSL=false
      # Development settings
      - FLASK_ENV=development
      - FLASK_DEBUG=1
      - PYTHONPATH=/app
    volumes:
      # Mount source code for live reload (development mode)
      - ./SnapApi/src:/app:Z
      # Mount config folder for persistence
      - snapapi-config:/app/config
      # Mount checkpoint storage
      - snapapi-checkpoints:/app/checkpoints
    networks:
      - snap-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/docs"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    command: >
      sh -c "
        # Start the API with hot reload
        uvicorn app:app --host 0.0.0.0 --port 8000 --reload --reload-dir /app
      "

  snapui:
    build:
      context: ./SnapUi
      dockerfile: Dockerfile.dev
    image: localhost:5000/snapui:v1.0.0
    container_name: snapui-dev
    ports:
      - "0.0.0.0:8080:8080"
    environment:
      # API configuration
      - API_URL=${API_URL:-http://192.168.33.209:8000}
      - WS_URL=${WS_URL:-ws://192.168.33.209:8000}
      # React environment variables
      - REACT_APP_API_URL=${API_URL:-http://192.168.33.209:8000}
      - REACT_APP_WS_URL=${WS_URL:-ws://192.168.33.209:8000}
      # Development settings for live reload
      - CHOKIDAR_USEPOLLING=true
      - WATCHPACK_POLLING=true
      - PORT=8080
      - HOST=0.0.0.0
    volumes:
      # Mount source code for live reload (development mode)
      - ./SnapUi/src/src:/app/src:Z
      - ./SnapUi/src/public:/app/public:Z
      # Mount node_modules to avoid conflicts (preserves installed dependencies)
      - /app/node_modules
    networks:
      - snap-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8080/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    command: >
      sh -c "
        export PATH=/usr/local/bin:/usr/bin:/bin:/usr/sbin:/sbin:$$PATH
        cd /app
        # Replace placeholders in index.html for development
        sed -i \"s|%REACT_APP_API_URL%|$${API_URL:-http://192.168.33.209:8000}|g\" /app/public/index.html
        sed -i \"s|%REACT_APP_WS_URL%|$${WS_URL:-ws://192.168.33.209:8000}|g\" /app/public/index.html
        # Start the dev server
        if [ -f /usr/local/bin/yarn ]; then
          PORT=8080 HOST=0.0.0.0 /usr/local/bin/yarn start
        elif [ -f /usr/bin/yarn ]; then
          PORT=8080 HOST=0.0.0.0 /usr/bin/yarn start
        else
          PORT=8080 HOST=0.0.0.0 /usr/local/bin/npm start
        fi
      "

volumes:
  snapapi-config:
    driver: local
  snapapi-checkpoints:
    driver: local

networks:
  snap-network:
    driver: bridge
